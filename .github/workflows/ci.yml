name: Film checks and Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions: {}
jobs:
  test:
    if: >-
      github.repository == 'kpok/cartoon_ai' &&
      github.repository_id == '1433681495' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    concurrency:
      group: trusted-film-checks
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:workflows
      - run: python3 -m unittest discover -s experiments/dancing-robot -p "test_*.py"
      - run: python3 scripts/validate-robot.py published/robot --published
      - run: npm run robot:check
      - run: npm run robot:sync
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kitten-film
          path: dist/
          retention-days: 1
      - name: Package tested build for Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
  regression:
    name: Browser and export regression
    if: >-
      github.repository == 'kpok/cartoon_ai' &&
      github.repository_id == '1433681495' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    permissions:
      contents: read
    concurrency:
      group: trusted-film-regression
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm run test:export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore
  deploy:
    name: Deploy tested film to GitHub Pages
    needs: test
    if: >-
      github.repository == 'kpok/cartoon_ai' &&
      github.repository_id == '1433681495' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.test.result == 'success' &&
      vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish tested build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

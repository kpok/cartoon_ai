name: Export cartoon MP4
on:
  workflow_dispatch:
    inputs:
      story:
        description: Story
        type: choice
        options: [garden, meadow]
        default: garden
      language:
        description: Dialogue and captions
        type: choice
        options: [en, pl]
        default: en
      format:
        description: Picture format
        type: choice
        options: [portrait, landscape]
        default: portrait
      quality:
        description: Portrait1080p or landscape1920p; draft uses360/640
        type: choice
        options: [full, draft]
        default: full
      dialogue:
        description: Offline synthetic voices or music only
        type: choice
        options: [tts, none]
        default: tts
permissions: {}
jobs:
  export:
    if: >-
      github.repository == 'kpok/cartoon_ai' &&
      github.repository_id == '1433681495' &&
      github.repository_owner_id == '10676481' &&
      github.actor_id == '10676481' &&
      github.actor == 'kpok' &&
      github.triggering_actor == 'kpok' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    concurrency:
      group: trusted-film-export
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npx playwright install --with-deps chromium
      - name: Render selected episode with audio
        env:
          STORY: ${{ inputs.story }}
          LANGUAGE: ${{ inputs.language }}
          FORMAT: ${{ inputs.format }}
          QUALITY: ${{ inputs.quality }}
          DIALOGUE: ${{ inputs.dialogue }}
        run: |
          if [ "$FORMAT" = portrait ]; then
            WIDTH=1080
            if [ "$QUALITY" = draft ]; then WIDTH=360; fi
          else
            WIDTH=1920
            if [ "$QUALITY" = draft ]; then WIDTH=640; fi
          fi
          npm run export:mp4 -- --story "$STORY" --lang "$LANGUAGE" --format "$FORMAT" --width "$WIDTH" --dialogue "$DIALOGUE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cartoon-${{ inputs.story }}-${{ inputs.language }}-${{ inputs.format }}
          path: exports/
          if-no-files-found: error
          retention-days: 14

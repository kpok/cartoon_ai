name: Sanitize commit email history
on:
  push:
    branches: [main]
    paths: [.github/workflows/sanitize-history.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitize:
    if: github.ref == 'refs/heads/main' && github.repository == 'kpok/cartoon_ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: sanitize-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Rewrite identities without changing file trees
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
          PRIVACY_EMAIL: 10676481+kpok@users.noreply.github.com
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          before_tree=$(git rev-parse 'HEAD^{tree}')
          before_count=$(git rev-list --count HEAD)
          git checkout -B main "$expected_head"
          git filter-branch --force --env-filter '
            case "$GIT_AUTHOR_EMAIL" in
              *@users.noreply.github.com|noreply@github.com) ;;
              *) export GIT_AUTHOR_EMAIL="$PRIVACY_EMAIL" ;;
            esac
            case "$GIT_COMMITTER_EMAIL" in
              *@users.noreply.github.com|noreply@github.com) ;;
              *) export GIT_COMMITTER_EMAIL="$PRIVACY_EMAIL" ;;
            esac
          ' -- main
          test "$(git rev-parse 'HEAD^{tree}')" = "$before_tree"
          test "$(git rev-list --count HEAD)" = "$before_count"
          if git log main --format='%ae%n%ce' | grep -vE '^([^@]+@users\.noreply\.github\.com|noreply@github\.com)$' >/dev/null; then
            echo 'Identity verification failed; refusing push.'
            exit 1
          fi
          git push --force-with-lease="refs/heads/main:$expected_head" origin main:main
          echo 'All reachable main commit identities use GitHub noreply addresses; file tree and commit count preserved.'

# Recheck commit privacy when delivering the music and dialogue update.
